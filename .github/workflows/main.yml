name: Build and publish

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build wisp-js
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          npm install
          npm run build:prod
          npm pack

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wisp-js
          path: |
            dist
            lib
            *.tgz
      
      - name: Publish to NPM
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish mercuryworkshop-wisp-js-*.tgz --access public --no-git-checks