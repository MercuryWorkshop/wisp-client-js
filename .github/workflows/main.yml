name: Build and publish

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build wisp-js
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Build
        run: |
          npm install
          npm run build:prod
          npm pack

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wisp-js
          path: |
            dist
            lib
            *.tgz
      
      - name: Publish to NPM
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm install -g npm@latest
          npm publish mercuryworkshop-wisp-js-*.tgz --access public --provenance